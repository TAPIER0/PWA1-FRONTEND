<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — PWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F6F5;
    --surface: #FFFFFF;
    --text: #202623;
    --text-muted: #58615C;
    --border: #D6DDD9;
    --primary: #255A4B;
    --primary-hover: #005F97;
    --focus: #255A4B;
    --accent: #9C7A4C;
    --error-bg: #FBF1E9;
    --error-text: #7A3B10;
    --error-border: #D98E4A;
    --radius: 14px;
    --font-scale: 1;
  }
  [data-contrast="alto"]{
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --text: #000000;
    --text-muted: #1A1A1A;
    --border: #000000;
    --primary: #255A4B;
    --primary-hover: #255A4B;
    --focus: #000000;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    color: var(--text);
    font-family: 'Atkinson Hyperlegible', Arial, sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 40px 16px;
    line-height: 1.55;
    font-size: calc(16px * var(--font-scale));
    position: relative;
    background: #FBFCFC;
    overflow-x: hidden;
  }

  /* ---------- Fondo con detalles sutiles (sin ruido visual fuerte) ---------- */
  .bg-decor{
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: #FBFCFC;
  }
  .bg-decor .blob{
    position:absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .35;
  }
  .bg-decor .blob-1{ width:520px; height:520px; top:-180px; left:-160px; background: #DCEBF6; }
  .bg-decor .blob-2{ width:460px; height:460px; bottom:-200px; right:-140px; background: #EAE7F2; }
  .bg-decor .blob-3{ width:320px; height:320px; bottom:8%; left:6%; background: #E4EEEA; opacity:.4; }
  .bg-decor .dots{
    position:absolute; inset:0;
    background-image: radial-gradient(circle, #D6DDD9 1.4px, transparent 1.4px);
    background-size: 26px 26px;
    opacity: .35;
    mask-image: radial-gradient(circle at 50% 35%, black 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 50% 35%, black 0%, transparent 72%);
  }
  @media (prefers-reduced-motion: no-preference){
    .bg-decor .blob{ transition: none; }
  }

  .layout{
    width: 100%;
    max-width: 460px;
    display:flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: 0 1px 2px rgba(32,38,35,0.04);
  }
  .settings-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    cursor:pointer;
    background:none;
    border:none;
    width:100%;
    font-family:inherit;
    color: var(--text);
    padding: 0;
  }
  .settings-header .title{
    font-size: calc(15px * var(--font-scale));
    font-weight: 700;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .settings-header .chevron{ font-size: 14px; color: var(--text-muted); }
  .settings-body{
    margin-top: 16px;
    display:none;
    flex-direction: column;
    gap: 18px;
  }
  .settings-body.open{ display:flex; }
  .setting-row{ display:flex; flex-direction:column; gap:8px; }
  .setting-row .label{ font-size: calc(13.5px * var(--font-scale)); font-weight:700; color: var(--text-muted); }
  .btn-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .opt-btn{
    font-family: inherit;
    font-size: calc(14px * var(--font-scale));
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
  }
  .opt-btn[aria-pressed="true"]{
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .opt-btn:focus{ outline: 3px solid var(--focus); outline-offset: 2px; }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 36px 36px;
    box-shadow: 0 18px 40px -20px rgba(32,38,35,0.18), 0 2px 6px rgba(32,38,35,0.05);
  }
  .logo-row{
    display:flex;
    justify-content:center;
    margin-bottom: 22px;
  }
  .logo-row img{
    height: 85px;
    width: auto;
    display:block;
  }
  h1{ font-size: calc(21px * var(--font-scale)); font-weight:700; margin:0 0 8px 0; text-align:center; }
  .subtitle{
    font-size: calc(14.5px * var(--font-scale));
    color: var(--text-muted);
    margin: 0 0 26px 0;
    text-align:center;
  }
  form{ display:flex; flex-direction:column; gap: 20px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  label{ font-size: calc(14px * var(--font-scale)); font-weight:700; }

  .input-row{ position: relative; display:flex; align-items:center; }
  .input-icon{
    position:absolute; left: 14px;
    width: 18px; height: 18px;
    color: var(--text-muted);
    pointer-events:none;
    display:flex;
  }
  .input-icon svg{ width:100%; height:100%; }

  input[type="email"], input[type="password"], input[type="text"]{
    font-family: inherit;
    font-size: calc(16px * var(--font-scale));
    width: 100%;
    padding: 13px 14px 13px 44px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    transition: none;
  }
  .password-row input[type="password"], .password-row input[type="text"]{
    padding-right: 76px;
  }
  input::placeholder{ color: var(--text-muted); opacity: .75; }
  input:hover{ border-color: #B9C3BD; }
  input:focus{
    outline: none;
    border-color: var(--focus);
    background: var(--surface);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 18%, transparent);
  }
  .field.invalid input{ border-color: var(--error-border); }
  .field.invalid input:focus{ box-shadow: 0 0 0 4px color-mix(in srgb, var(--error-border) 20%, transparent); }
  .error-msg{
    display:none;
    font-size: calc(13.5px * var(--font-scale));
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .error-msg.show{ display:block; }
  .password-row{ position: relative; display:flex; align-items:center; }
  .toggle-visibility{
    position:absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: var(--surface); border: 1px solid var(--border);
    font-family: inherit; font-size: calc(12.5px * var(--font-scale));
    font-weight: 700; color: var(--primary);
    padding: 6px 10px; cursor: pointer; border-radius: 6px;
  }
  .toggle-visibility:hover{ background: var(--bg); }
  .toggle-visibility:focus{ outline: 3px solid var(--focus); outline-offset: 1px; }
  .primary-btn{
    font-family: inherit; font-size: calc(16px * var(--font-scale)); font-weight: 700;
    color: #fff; background: var(--primary); border: none; border-radius: 8px;
    padding: 14px 16px; cursor: pointer; margin-top: 4px;
  }
  .primary-btn:hover{ background: var(--primary-hover); }
  .primary-btn:focus{ outline: 3px solid var(--focus); outline-offset: 2px; }
  .status-region{ margin-top: 18px; font-size: calc(13.5px * var(--font-scale)); color: var(--text-muted); text-align:center; }
  @media (max-width: 560px){ .card{ padding: 30px 24px 26px; } }
</style>
<script src="api-client.js"></script>
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="dots"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="layout" data-contrast="normal" id="root">

  <section class="panel">
    <button type="button" class="settings-header" id="settings-toggle" aria-expanded="false" aria-controls="settings-body">
      <span class="title">Ajustar la pantalla a tu comodidad</span>
      <span class="chevron" id="chevron">Mostrar ▾</span>
    </button>
    <div class="settings-body" id="settings-body">
      <div class="setting-row">
        <span class="label">Tamaño del texto</span>
        <div class="btn-group" role="group" aria-label="Tamaño del texto">
          <button type="button" class="opt-btn" data-scale="0.9">Pequeño</button>
          <button type="button" class="opt-btn" data-scale="1" aria-pressed="true">Normal</button>
          <button type="button" class="opt-btn" data-scale="1.2">Grande</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="label">Contraste</span>
        <div class="btn-group" role="group" aria-label="Contraste">
          <button type="button" class="opt-btn" data-contrast="normal" aria-pressed="true">Normal</button>
          <button type="button" class="opt-btn" data-contrast="alto">Alto contraste</button>
        </div>
      </div>
      <p style="font-size: calc(13px * var(--font-scale)); color: var(--text-muted); margin:0;">
        Esta pantalla no tiene animaciones automáticas ni sonidos. Los cambios que hagas aquí solo afectan cómo se ve esta página.
      </p>
    </div>
  </section>

    <h1>Iniciar sesión</h1>
    <p class="subtitle">Escribe tu correo y tu contraseña para entrar a tu cuenta.</p>

    <form id="login-form" novalidate>
      <div class="field" id="email-field">
        <label for="email">Correo electrónico</label>
        <div class="input-row">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          </span>
          <input type="email" id="email" autocomplete="username" aria-describedby="email-error" placeholder="nombre@correo.com">
        </div>
        <div class="error-msg" id="email-error" role="alert"></div>
      </div>

      <div class="field" id="password-field">
        <label for="password">Contraseña</label>
        <div class="password-row">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <input type="password" id="password" autocomplete="current-password" aria-describedby="password-error" placeholder="Tu contraseña">
          <button type="button" class="toggle-visibility" id="toggle-pw" aria-pressed="false">Mostrar</button>
        </div>
        <div class="error-msg" id="password-error" role="alert"></div>
      </div>

      <button type="submit" class="primary-btn">Iniciar sesión</button>
    </form>

    <p class="status-region" id="status" aria-live="polite"></p>
  </main>
</div>

<script>
  const root = document.getElementById('root');
  const settingsToggle = document.getElementById('settings-toggle');
  const settingsBody = document.getElementById('settings-body');
  const chevron = document.getElementById('chevron');

  settingsToggle.addEventListener('click', () => {
    const isOpen = settingsBody.classList.toggle('open');
    settingsToggle.setAttribute('aria-expanded', String(isOpen));
    chevron.textContent = isOpen ? 'Ocultar ▴' : 'Mostrar ▾';
  });

  document.querySelectorAll('[data-scale]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-scale]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      document.documentElement.style.setProperty('--font-scale', btn.dataset.scale);
    });
  });

  document.querySelectorAll('[data-contrast]').forEach(btn => {
    if(!btn.hasAttribute('data-scale')){
      btn.addEventListener('click', () => {
        document.querySelectorAll('.opt-btn[data-contrast]').forEach(b => b.setAttribute('aria-pressed', 'false'));
        btn.setAttribute('aria-pressed', 'true');
        root.setAttribute('data-contrast', btn.dataset.contrast);
      });
    }
  });

  const form = document.getElementById('login-form');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const emailField = document.getElementById('email-field');
  const passwordField = document.getElementById('password-field');
  const emailError = document.getElementById('email-error');
  const passwordError = document.getElementById('password-error');
  const status = document.getElementById('status');
  const toggleBtn = document.getElementById('toggle-pw');

  toggleBtn.addEventListener('click', () => {
    const isHidden = password.type === 'password';
    password.type = isHidden ? 'text' : 'password';
    toggleBtn.textContent = isHidden ? 'Ocultar' : 'Mostrar';
    toggleBtn.setAttribute('aria-pressed', String(isHidden));
  });

  function setError(field, msgEl, message){
    field.classList.add('invalid');
    msgEl.textContent = message;
    msgEl.classList.add('show');
  }
  function clearError(field, msgEl){
    field.classList.remove('invalid');
    msgEl.textContent = '';
    msgEl.classList.remove('show');
  }

  email.addEventListener('blur', () => {
    if(email.value.trim() === ''){
      setError(emailField, emailError, 'Escribe tu correo electrónico para continuar. Este campo no puede quedar vacío.');
    } else if(!email.value.includes('@')){
      setError(emailField, emailError, 'El correo debe incluir el símbolo @. Ejemplo: nombre@correo.com');
    } else {
      clearError(emailField, emailError);
    }
  });

  password.addEventListener('blur', () => {
    if(password.value === ''){
      setError(passwordField, passwordError, 'Escribe tu contraseña para continuar. Este campo no puede quedar vacío.');
    } else {
      clearError(passwordField, passwordError);
    }
  });

  const submitBtn = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    let valid = true;
    if(email.value.trim() === '' || !email.value.includes('@')){
      valid = false;
      email.dispatchEvent(new Event('blur'));
    }
    if(password.value === ''){
      valid = false;
      password.dispatchEvent(new Event('blur'));
    }

    if (!valid) {
      status.textContent = 'Hay campos por corregir. Revisa los mensajes junto a cada campo.';
      return;
    }

    submitBtn.disabled = true;
    status.textContent = 'Conectando con el servidor...';

    try {
      const response = await fetch(`${ApiClient.baseUrl}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email.value.trim(),
          password: password.value
        })
      });

      const resData = await response.json();

      if (response.ok && resData.success) {
        status.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
        ApiClient.saveSession(resData.data);
        setTimeout(() => {
          ApiClient.redirectToRoleHome(resData.data.user);
        }, 500);
      } else {
        submitBtn.disabled = false;
        const msg = resData.message || (resData.errors && resData.errors.join('. ')) || 'Credenciales incorrectas.';
        status.textContent = msg;
      }
    } catch (err) {
      submitBtn.disabled = false;
      console.error('Error al conectar:', err);
      status.textContent = 'No se pudo conectar con el servidor (http://localhost:5264). Asegúrate de que el backend esté ejecutándose.';
    }
  });
</script>
</body>
</html>
